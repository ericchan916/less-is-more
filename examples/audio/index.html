    <section class="hero wrap" aria-labelledby="hero-title">
      <div class="hero-top"><h1 id="hero-title">AURA One<br><span>桌面好声音</span></h1></div>
      <figure class="product-stage"><img src="assets/aura-speaker.png" alt="暖银色金属桌面音响，细密网孔、橡木底座与暖橙色旋钮" width="1536" height="1024" fetchpriority="high"></figure>
