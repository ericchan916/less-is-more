<body class="coffee" data-industry="coffee"><a class="skip" href="#flavour">跳至风味选择</a><section class="coffee-hero"><img class="hero-photo" src="assets/coffee.png" alt="核桃木桌上的奶油色浓缩咖啡杯与无标识咖啡袋" width="1536" height="1024" fetchpriority="high"><header class="header shell over-image"><a class="wordmark" href="index.html">余味</a><nav aria-label="主导航"><a href="#flavour">风味</a><button class="line-button" data-open="list-dialog">清单 <span id="coffee-count">0</span></button></nav></header><div class="coffee-title shell"><h1>一杯刚好</h1><a href="#flavour" class="light-button">选一款 <span aria-hidden="true">↘</span></a></div></section>
