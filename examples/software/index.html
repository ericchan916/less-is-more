<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111214"><title>FORM 文稿工作台</title><link rel="icon" href="data:,"><link rel="stylesheet" href="form.css?asset=e606e3dccc35"><script src="form.js?asset=767c48de74b6" defer></script></head>
<body><a class="skip" href="#workspace">跳至工作台</a>
<header class="form-header shell"><a class="form-brand" href="index.html" aria-label="FORM 首页"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 5h20v5H9v4h12v5H9v5H4z" fill="currentColor"/></svg>FORM</a><nav aria-label="主导航"><a href="#privacy">隐私</a><a class="nav-cta" href="#workspace">打开工作台 <span aria-hidden="true">↗</span></a></nav></header>
<main><section class="form-hero shell"><div class="headline-row"><h1>想法成形<br><span>文稿有序</span></h1></div>
<section class="workspace" id="workspace" aria-label="文稿工作台">
<div class="workspace-grid"><aside class="source-pane"><div class="pane-heading"><label for="source">原始想法</label></div><textarea id="source" spellcheck="false"></textarea><div class="source-footer"><div class="sample-options" aria-label="选择示例"><button data-sample="book">书店活动</button><button data-sample="product">产品发布</button><button data-sample="meeting">会议纪要</button></div><button class="undo-sample" id="undo-sample" hidden>撤销替换</button></div></aside>
<section class="document-pane" aria-label="整理结果"><div class="document-toolbar"><div class="result-switch" role="group" aria-label="结果类型"><button id="tab-outline" data-tab="outline" aria-pressed="true">提纲</button><button id="tab-actions" data-tab="actions" aria-pressed="false">行动项</button></div><div class="document-actions"><button class="export-btn" id="export" aria-label="导出当前结果"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg><span>导出</span></button><button class="run-btn" id="run">整理文稿<span aria-hidden="true">↗</span></button></div></div><div class="document-paper"><label class="sr-only" for="document-title">文稿标题</label><input id="document-title" class="document-title" value="周末书店计划" maxlength="80"><div class="paper-line"></div><label class="sr-only" id="result-label" for="result">提纲，可编辑</label><textarea id="result" spellcheck="false" aria-labelledby="result-label"></textarea><div class="document-foot"><span id="document-status" role="status">已保存</span></div></div></section></div></section>
</section>
<section class="privacy-section shell" id="privacy"><h2>本地处理</h2><p>内容仅存此浏览器<br>本地规则整理 无在线模型</p></section>
</main><footer class="shell"><a class="form-brand" href="index.html" aria-label="FORM 首页">FORM</a><p>原创软件概念 本地演示</p></footer>
</body></html>
